name: Generar imágenes cada 5 minutos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # necesario para poder hacer git push en ESTE repo

jobs:
  generar-imagenes:
    runs-on: ubuntu-latest

    # 👇 aquí inyectamos los tokens al entorno del job (y por tanto al script)
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # usamos el token automático del repo actual
      GH_REPO: ${{ github.repository }}         # owner/repo de ESTE repo
      GH_BRANCH: ${{ github.ref_name }}         # rama actual (normalmente main)
      AUDIO_REEL_PATH: bancard_theme.mp3        # ruta del mp3 dentro del repo (ajusta si lo pones en carpeta)

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # para poder hacer commit/push sin líos

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema (ffmpeg + fuentes para Pillow)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfreetype6-dev libjpeg-dev zlib1g-dev

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow moviepy

      - name: Ejecutar script (genera imágenes, publica en IG y crea reel)
        run: python generador_post_loteria.py

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Hacer commit de imágenes generadas
        run: |
          # Si no hay archivos que coincidan con post_*.png, no hacemos nada
          if ls post_*.png 1> /dev/null 2>&1; then
            echo "🖼️ Se encontraron imágenes generadas, preparando commit..."
            git add post_*.png

            # Solo hacer commit si realmente hay cambios staged
            if ! git diff --cached --quiet; then
              git commit -m "🖼️ Publicaciones automáticas generadas [skip ci]"
              git push
              echo "✅ Imágenes commiteadas y pusheadas."
            else
              echo "ℹ️ No hay cambios nuevos en las imágenes. No se hace commit."
            fi
          else
            echo "ℹ️ No se generaron imágenes (post_*.png), nada que commitear."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
