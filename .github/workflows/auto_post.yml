name: Generar imágenes cada 5 minutos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # necesario para poder hacer git push

jobs:
  generar-imagenes:
    runs-on: ubuntu-latest

    # 👇 aquí inyectamos los tokens al entorno del job (y por tanto al script)
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # para poder hacer commit/push sin líos

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libjpeg-dev zlib1g-dev
          pip install requests pillow

      - name: Ejecutar script (genera imágenes + publica en IG)
        run: python generador_post_loteria.py

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Hacer commit de imágenes generadas
        run: |
          # Si no hay archivos que coincidan con post_*.png, no hacemos nada
          if ls post_*.png 1> /dev/null 2>&1; then
            echo "🖼️ Se encontraron imágenes generadas, preparando commit..."
            git add post_*.png

            # Solo hacer commit si realmente hay cambios staged
            if ! git diff --cached --quiet; then
              git commit -m "🖼️ Publicaciones automáticas generadas [skip ci]"
              git push
              echo "✅ Imágenes commiteadas y pusheadas."
            else
              echo "ℹ️ No hay cambios nuevos en las imágenes. No se hace commit."
            fi
          else
            echo "ℹ️ No se generaron imágenes (post_*.png), nada que commitear."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
